<div class="loading-overlay" *ngIf="show">
  <div class="loading-content">
    <video
      #bangbooVideo
      [src]="'assets/data/images/page-icons/bangbooloading.mp4'"
      [autoplay]="true"
      [loop]="true"
      [muted]="true"
      [attr.playsinline]="true"
      class="bangboo-video">
    </video>
    <div class="loading-text">{{ message }}</div>
  </div>
</div>
