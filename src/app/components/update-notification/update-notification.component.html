<!-- DEV ONLY: Test button to simulate update notification -->
<button
  *ngIf="showDevTestButton && !updateAvailable"
  class="dev-test-button"
  (click)="testUpdateNotification()"
  title="Test update notification (dev only)">
  Test Update
</button>

<!-- Actual update notification -->
<div class="update-notification" *ngIf="updateAvailable">
  <div class="update-content">
    <div class="update-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
    </div>
    <div class="update-text">
      <strong>Update Available</strong>
      <p>A new version is ready to install</p>
    </div>
    <button class="update-button" (click)="applyUpdate()">
      Update Now
    </button>
  </div>
</div>
