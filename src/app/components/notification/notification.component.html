<div class="notification-container" *ngIf="notification" [class.closing]="isClosing">
  <div class="notification" [class]="'notification-' + notification.type">
    <span class="notification-message">{{ notification.message }}</span>
    <button *ngIf="notification.action" class="notification-action" (click)="onAction()">
      {{ notification.action.label }}
    </button>
    <button class="notification-close" (click)="close()">&times;</button>
  </div>
</div>
